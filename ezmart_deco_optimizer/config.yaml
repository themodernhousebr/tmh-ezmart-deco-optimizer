name: EZmart Deco Optimizer
version: "0.11.0-dev.6"
slug: ezmart_deco_optimizer
url: https://github.com/themodernhousebr/tmh-ezmart-deco-optimizer
description: Otimização Deco sob demanda e entidades para automações Home Assistant
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
services:
  - mqtt:want
options:
  deco_model: m9_plus
  host: ""
  tmp_email: ""
  tmp_password: ""
  password: ""
  tmp_host_key_mode: automatic
  tmp_host_key_sha256: ""
  x50_certificate_mode: automatic
  x50_certificate_sha256: ""
  tmp_enabled: false
  mqtt_enabled: false
  mqtt_commands_enabled: false
schema:
  deco_model: list(m9_plus|x50)
  host: str
  tmp_email: str
  tmp_password: password
  password: password
  tmp_host_key_mode: list(automatic|pinned)
  tmp_host_key_sha256: str
  x50_certificate_mode: list(automatic|pinned)
  x50_certificate_sha256: str
  tmp_enabled: bool
  mqtt_enabled: bool
  mqtt_commands_enabled: bool
  guest_control_enabled: bool?
  request_cooldown_seconds: int(900,86400)?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: bool?
  username: str?
  poll_seconds: int(30,86400)?
  diagnose_acs: bool?
  diagnose_wifi_support: bool?
  diagnose_channels: bool?
  diagnose_performance: bool?
  diagnostic_seconds: int(0,86400)?
  tmp_action: list(read|scan|optimize|verify)?
  tmp_scan_backend: list(legacy|m9_acs)?
  tmp_scan_request_id: str?
  tmp_scan_timeout_seconds: int(30,180)?
  tmp_optimize_request_id: str?
  tmp_apply_timeout_seconds: int(10,180)?
  tmp_verify_delay_seconds: int(5,180)?
  tmp_verify_timeout_seconds: int(30,600)?
  tmp_verify_interval_seconds: int(5,60)?
  tmp_timeout_seconds: int(5,30)?
