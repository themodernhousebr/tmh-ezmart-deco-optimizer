configuration:
  deco_model:
    name: Modelo do Deco principal
    description: m5 monitora por HTTP e permite ações em piloto 3.0/3.2, firmware 1.9.5 Build 20260602 Rel. 25369, Router/AP; outros perfis permanecem bloqueados. m9_plus mantém o transporte M9. x50 usa TLS. Perfis Router: 1.30 / 1.8.4 Build 26051413 Rel. 27460 e piloto 1.0 / 1.11.1 Build 26081714 Rel. 32981. Não há troca automática de transporte.
  x50_certificate_mode:
    name: X50 — obtenção do certificado
    description: automatic obtém e salva o certificado validado do fabricante na primeira conexão. pinned exige preenchimento manual. Um certificado já informado tem prioridade; mudanças de identidade são bloqueadas.
  x50_certificate_sha256:
    name: X50 — certificado conferido
    description: No modo automatic, deixe vazio para obter e salvar o certificado deste X50. No modo pinned, preencha a impressão conferida. Um valor informado tem prioridade; divergências bloqueiam a conexão. Deixe vazio no M9.
  mqtt_enabled:
    name: Entidades no Home Assistant
    description: Publica botões e sensores via MQTT. Quando ativado, o app aguarda pedidos; não executa a ação TMP antiga ao iniciar.
  mqtt_commands_enabled:
    name: Aceitar comandos do Home Assistant
    description: Permite otimização e, se habilitado, controle de visitantes. Desativar mantém o monitoramento e impede novos pedidos.
  guest_control_enabled:
    name: Controlar Wi-Fi de visitantes (piloto)
    description: Adiciona um interruptor para visitantes em 2,4 e 5 GHz. Usa a rede já configurada no Deco e confirma o estado por leitura. M9 V2 1.9.1 AP/FAP; X50 Router 1.30 / 1.8.4 e piloto 1.0 / 1.11.1. M5 3.0/3.2, 1.9.5 Router/AP também em piloto; ações M5 aguardam validação física. Desativado por padrão.
  request_cooldown_seconds:
    name: Intervalo mínimo entre pedidos
    description: Padrão e mínimo de 600 segundos (10 minutos) no M9 e X50, inclusive quando a análise não recomenda mudança. O intervalo é preservado após reinício.
  mqtt_host:
    name: Servidor MQTT alternativo
    description: Deixe vazio para usar automaticamente o Mosquitto fornecido pelo Supervisor.
  mqtt_port:
    name: Porta do MQTT alternativo
  mqtt_username:
    name: Usuário do MQTT alternativo
  mqtt_password:
    name: Senha do MQTT alternativo
  mqtt_tls:
    name: TLS no MQTT alternativo
    description: Exige certificado válido e confiável. Com servidor vazio, utiliza a configuração do serviço do Supervisor.
  host:
    name: IP do Deco principal
  username:
    name: M9 — usuário HTTPS (avançado)
    description: Padrão admin. Ignorado no X50.
  password:
    name: M9 — senha HTTPS
    description: Necessária para o monitoramento M9. Deixe vazia no X50; ele usa a conta proprietária informada abaixo.
  poll_seconds:
    name: Intervalo do monitoramento
    description: Padrão 30 segundos no M9 e mínimo 60 no X50; não agenda otimizações. Pedidos do Home Assistant acordam o app sem esperar esse intervalo.
  diagnose_acs:
    name: M9 avançado — ACS antigo desativado
    description: Opção mantida por compatibilidade. Não realiza consultas; a análise ACS é uma ação explícita.
  diagnose_wifi_support:
    name: M9 avançado — consultar capacidades Wi-Fi
    description: No M9 do piloto essa consulta retorna erro API 1 e pode ficar desativada.
  diagnose_channels:
    name: Consultar canais
    description: No modo MQTT os canais são acompanhados automaticamente, mesmo com esta opção desativada.
  diagnose_performance:
    name: M9 avançado — consultar CPU e memória
    description: Opcional. Este diagnóstico não é consultado no X50.
  diagnostic_seconds:
    name: M9 avançado — intervalo dos diagnósticos
    description: No modo manual, zero consulta uma vez. No modo MQTT, canais seguem o monitoramento e demais diagnósticos usam no mínimo 60 segundos.
  tmp_enabled:
    name: Habilitar ações do Deco
    description: Necessário para os pedidos de otimização. Não altera o intervalo nem executa otimizações por conta própria no modo MQTT.
  tmp_action:
    name: M9 manual — ação ao iniciar sem MQTT
    description: Sempre ignorada no X50. No M9, ignorada quando Entidades no Home Assistant está ativado. Use os botões para otimizar ou verificar sob demanda.
  tmp_scan_backend:
    name: M9 avançado — método de otimização
    description: No modo MQTT novo, o padrão é m9_acs. Ignorado no X50. O método legacy não permite aplicar otimização.
  tmp_scan_request_id:
    name: M9 manual — ID da análise
    description: Usado apenas com scan no modo sem MQTT. Botões do Home Assistant geram IDs automaticamente.
  tmp_optimize_request_id:
    name: M9 manual — ID da aplicação
    description: Usado apenas com optimize ou verify no modo sem MQTT. Sem espaços. Os botões geram ou recuperam o ID automaticamente.
  tmp_scan_timeout_seconds:
    name: Prazo da análise
  tmp_apply_timeout_seconds:
    name: Prazo da resposta à aplicação
    description: Timeout nunca causa reenvio automático da aplicação.
  tmp_verify_delay_seconds:
    name: M9 avançado — espera antes de verificar
    description: No X50 a espera é fixa em 30 segundos.
  tmp_verify_timeout_seconds:
    name: Avançado — prazo da verificação
    description: Padrão 120 segundos. No X50 o máximo efetivo é 300 segundos e seis leituras.
  tmp_verify_interval_seconds:
    name: M9 avançado — intervalo entre leituras
    description: No X50 o intervalo é fixo em 10 segundos.
  tmp_timeout_seconds:
    name: Avançado — prazo da conexão Deco
  tmp_email:
    name: E-mail da conta proprietária Deco
    description: Use a conta proprietária da rede que será configurada.
  tmp_password:
    name: Senha da conta proprietária Deco
  tmp_host_key_mode:
    name: "M9 — confiança da chave SSH"
    description: "Automático (padrão): confia no IP reservado e aceita a chave desta conexão. Pinned: exige o fingerprint configurado. Não se aplica ao certificado X50."
  tmp_host_key_sha256:
    name: M9 — chave SSH conferida
    description: Exigida apenas no modo pinned. No automático não valida a conexão. Preserve valores já salvos para manter a identidade do histórico. Deixe vazio no X50.
