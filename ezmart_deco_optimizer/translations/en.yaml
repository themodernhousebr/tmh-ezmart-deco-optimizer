configuration:
  deco_model:
    name: Main Deco model
    description: Select m5 for HTTP monitoring and pilot SSH/TMP actions on 3.0/3.2 firmware 1.9.5 Router/AP, m9_plus for the existing M9 installation, or x50 for X50 Router profiles 1.30 / 1.8.4 or pilot 1.0 / 1.11.1. No automatic transport fallback.
  host:
    name: Main Deco IP address
  tmp_email:
    name: Deco owner account email
    description: Use the account for this installation, not an account from another home.
  tmp_password:
    name: Deco owner account password
  password:
    name: M9 — HTTPS password
    description: Required for M9 monitoring. Leave empty for X50.
  tmp_host_key_mode:
    name: "M9 — SSH host key trust"
    description: "Automatic (default): trusts the reserved IP and accepts the key presented on each connection. Pinned: requires the configured fingerprint. Does not affect X50 certificate verification."
  tmp_host_key_sha256:
    name: M9 — verified SSH fingerprint
    description: Required only in pinned mode. Automatic mode does not validate this fingerprint. Keep saved values to preserve journal identity. Leave empty for X50.
  x50_certificate_mode:
    name: X50 certificate enrollment
    description: automatic enrolls and saves the vendor-verified certificate on first connection. pinned requires a manual fingerprint. Existing fingerprints take priority; identity changes are blocked.
  x50_certificate_sha256:
    name: X50 — verified certificate fingerprint
    description: Use certificate_sha256 from this X50 diagnostic. Leave empty for M9. A mismatch blocks connection.
  tmp_enabled:
    name: Enable Deco actions
    description: Required for optimization requests. With MQTT enabled, startup only monitors; it does not optimize.
  mqtt_enabled:
    name: Home Assistant entities
    description: Publishes buttons and sensors over MQTT. Disables the old M9 startup action.
  mqtt_commands_enabled:
    name: Accept Home Assistant commands
    description: Allows optimization and, when enabled, guest Wi-Fi commands. Disable to keep monitoring only.
  guest_control_enabled:
    name: Guest Wi-Fi control (pilot)
    description: Adds a switch for the existing 2.4 and 5 GHz guest network, with observed state confirmation. M9 V2 1.9.1 AP/FAP and X50 Router 1.30 / 1.8.4 and pilot 1.0 / 1.11.1. M5 3.0/3.2 firmware 1.9.5 Router/AP is also a pilot; physical action validation on M5 is pending. Disabled by default.
  mqtt_host:
    name: Advanced — alternative MQTT server
    description: Leave absent or empty to obtain the Mosquitto connection automatically from Supervisor.
  mqtt_username:
    name: Alternative MQTT username
  mqtt_password:
    name: Alternative MQTT password
  mqtt_port:
    name: Alternative MQTT port
  mqtt_tls:
    name: Alternative MQTT TLS
  request_cooldown_seconds:
    name: Advanced — minimum request interval
    description: Default and minimum 600 seconds (10 minutes) for M9 and X50, including negative recommendations. Survives restart.
  poll_seconds:
    name: Advanced — monitoring interval
    description: Default 30 seconds for M9, minimum 60 for X50. Monitoring never requests ACS analysis.
  username:
    name: M9 advanced — HTTPS username
    description: Defaults to admin. Ignored for X50.
  tmp_action:
    name: M9 manual — startup action without MQTT
    description: Ignored for X50 and whenever MQTT entities are enabled.
  tmp_scan_backend:
    name: M9 advanced — analysis method
    description: Defaults to m9_acs for new MQTT installations. Ignored for X50.
  tmp_scan_request_id:
    name: M9 manual — scan request ID
    description: Not needed by Home Assistant buttons; IDs are automatic.
  tmp_optimize_request_id:
    name: M9 manual — application request ID
    description: Not needed by Home Assistant buttons; IDs are automatic.
  tmp_timeout_seconds:
    name: Advanced — Deco connection timeout
  tmp_scan_timeout_seconds:
    name: Advanced — analysis timeout
  tmp_apply_timeout_seconds:
    name: Advanced — application response timeout
    description: A timeout never retries the application command.
  tmp_verify_timeout_seconds:
    name: Advanced — verification timeout
    description: Default 120 seconds. X50 uses at most 300 seconds and six readings.
  tmp_verify_delay_seconds:
    name: M9 advanced — delay before verification
    description: X50 always waits 30 seconds.
  tmp_verify_interval_seconds:
    name: M9 advanced — verification reading interval
    description: X50 always uses 10 seconds.
  diagnose_acs:
    name: M9 legacy ACS — disabled
    description: Kept for compatibility; does not perform periodic analysis.
  diagnose_wifi_support:
    name: M9 advanced — read Wi-Fi capabilities
  diagnose_channels:
    name: M9 advanced — read channels
    description: MQTT mode already monitors channels automatically. X50 always reads backhaul.
  diagnose_performance:
    name: M9 advanced — read CPU and memory
    description: This diagnostic is not queried on X50.
  diagnostic_seconds:
    name: M9 advanced — diagnostic interval
